name: Core and optional official SDK checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2a-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: stdlib core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.9'
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Sequential actual HTTP integration
        run: python -m unittest discover -s tests/integration -v
      - name: Fresh exact eight-case suite
        run: python -m a2a_recovery_lab demo --suite core --seed 7 --out work/ci-core
      - name: Recorded report reader
        run: python -m a2a_recovery_lab report work/ci-core/report.json

  sdk:
    name: optional pinned SDK / ${{ matrix.os }}
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.9'
      - name: Separate optional environment
        run: python -m venv work/sdk-check-venv
      - name: Binary/hash-pinned SDK install and check / Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          work/sdk-check-venv/Scripts/python.exe -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --disable-pip-version-check -r requirements-sdk-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          work/sdk-check-venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          work/sdk-check-venv/Scripts/python.exe scripts/sdk_smoke.py --out work/ci-sdk
          exit $LASTEXITCODE
      - name: Binary/hash-pinned SDK install and check / Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          work/sdk-check-venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --disable-pip-version-check -r requirements-sdk-check.txt
          work/sdk-check-venv/bin/python -m pip check
          work/sdk-check-venv/bin/python scripts/sdk_smoke.py --out work/ci-sdk
